name: Infinix Image Crop Regression
on:
  push:
    branches: [main]
    paths:
      - 'tools/infinix-image-bot/bot.py'
      - 'tools/infinix-image-bot/test_image_compositor.py'
      - '.github/workflows/infinix_bot_crop_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pixel-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install same Pillow version as existing bot
        run: python -m pip install -r tools/infinix-image-bot/requirements.txt
      - name: Verify image compositor and exact source pixel preservation
        run: python -m unittest discover -s tools/infinix-image-bot -p test_image_compositor.py -v
