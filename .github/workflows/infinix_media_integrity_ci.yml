name: Infinix Media Integrity

on:
  pull_request:
    paths:
      - 'device-media/**'
      - 'tools/infinix-image-bot/**'
      - '.github/workflows/infinix_device_images.yml'
      - '.github/workflows/infinix_media_integrity_ci.yml'
  push:
    branches: [main]
    paths:
      - 'device-media/**'
      - 'tools/infinix-image-bot/**'
      - '.github/workflows/infinix_device_images.yml'
      - '.github/workflows/infinix_media_integrity_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install bot dependencies
        run: python -m pip install -r tools/infinix-image-bot/requirements.txt
      - name: Parse distribution metadata strictly
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (
              Path("device-media/distribution.json"),
              Path("device-media/device_media_manifest.json"),
          ):
              json.loads(path.read_text())
              print(f"PASS JSON: {path}")
          PY
      - name: Build immutable base metadata
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF" --depth=1
          git show "origin/$GITHUB_BASE_REF:device-media/device_media_manifest.json" > "$RUNNER_TEMP/device_media_manifest.baseline.json"
          git show "origin/$GITHUB_BASE_REF:device-media/distribution.json" > "$RUNNER_TEMP/distribution.baseline.json"
      - name: Reject deletion of existing media files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          deleted="$(git diff --name-only --diff-filter=D "origin/$GITHUB_BASE_REF"...HEAD -- device-media/)"
          if [ -n "$deleted" ]; then
            echo "ALWAN-MEDIA-DELETE-DENIED: existing media files must be preserved:"
            echo "$deleted"
            exit 1
          fi
      - name: Protect published media or validate an intentional migration
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="$(git rev-parse "origin/$GITHUB_BASE_REF")"
          PLAN_ARGS=()
          if git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD -- device-media/migration_plan.json | grep -q .; then
            PLAN_ARGS=(--migration-plan device-media/migration_plan.json)
          fi
          python tools/infinix-image-bot/media_integrity_guard.py             --baseline-manifest "$RUNNER_TEMP/device_media_manifest.baseline.json"             --baseline-distribution "$RUNNER_TEMP/distribution.baseline.json"             --current-manifest device-media/device_media_manifest.json             --current-distribution device-media/distribution.json             --base-commit "$BASE_SHA"             "${PLAN_ARGS[@]}"
      - name: Verify media payloads and presentation
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD -- device-media/migration_plan.json | grep -q .; then
              python tools/infinix-image-bot/verify_media.py \
                --baseline-manifest "$RUNNER_TEMP/device_media_manifest.baseline.json" \
                --migration-mode
            else
              python tools/infinix-image-bot/verify_media.py \
                --baseline-manifest "$RUNNER_TEMP/device_media_manifest.baseline.json"
            fi
          else
            python tools/infinix-image-bot/verify_media.py
          fi
      - name: Run offline regression suite
        run: |
          mkdir -p tools/infinix-image-bot/output
          python -m unittest discover -s tools/infinix-image-bot -p 'test_*.py' -v
      - name: Reject whitespace damage
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "origin/$GITHUB_BASE_REF"...HEAD
          else
            git diff --check HEAD^ HEAD
          fi