name: Infinix Media Integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install bot dependencies
        run: python -m pip install -r .github/release-guards/requirements.txt
      - name: Parse distribution metadata strictly
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (
              Path("device-media/distribution.json"),
              Path("device-media/device_media_manifest.json"),
          ):
              json.loads(path.read_text())
              print(f"PASS JSON: {path}")
          PY
      - name: Read immutable production baseline for every execution mode
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            base="$PUSH_BEFORE_SHA"
          else
            git fetch origin main
            base="$(git rev-parse origin/main)"
          fi
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" =~ ^0{40}$ ]]; then
            echo "ALWAN-MEDIA-BASELINE-MISSING: cannot safely validate without published base"
            exit 1
          fi
          git cat-file -e "$base^{commit}"
          git show "$base:device-media/device_media_manifest.json" > "$RUNNER_TEMP/device_media_manifest.baseline.json"
          git show "$base:device-media/distribution.json" > "$RUNNER_TEMP/distribution.baseline.json"
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
      - name: Reject deletion of existing media files
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-only --diff-filter=D "$BASE_SHA"...HEAD -- device-media/)"
          if [ -n "$deleted" ]; then
            echo "ALWAN-MEDIA-DELETE-DENIED: existing media files must be preserved:"
            echo "$deleted"
            exit 1
          fi
      - name: Protect published media or validate an intentional migration
        shell: bash
        run: |
          set -euo pipefail
          PLAN_ARGS=()
          if git diff --name-only "$BASE_SHA"...HEAD -- device-media/migration_plan.json | grep -q .; then
            PLAN_ARGS=(--migration-plan device-media/migration_plan.json)
          fi
          python .github/release-guards/media_integrity_guard.py \
            --baseline-manifest "$RUNNER_TEMP/device_media_manifest.baseline.json" \
            --baseline-distribution "$RUNNER_TEMP/distribution.baseline.json" \
            --current-manifest device-media/device_media_manifest.json \
            --current-distribution device-media/distribution.json \
            --base-commit "$BASE_SHA" \
            "${PLAN_ARGS[@]}"
      - name: Verify media payloads, downloads, and presentation
        shell: bash
        run: |
          set -euo pipefail
          PLAN_ARGS=()
          if git diff --name-only "$BASE_SHA"...HEAD -- device-media/migration_plan.json | grep -q .; then
            PLAN_ARGS=(--migration-mode)
          fi
          python .github/release-guards/verify_media.py \
            --baseline-manifest "$RUNNER_TEMP/device_media_manifest.baseline.json" \
            --catalog compatibility/payloads/catalog.json \
            "${PLAN_ARGS[@]}"
      - name: Run isolated production-validator regression suite (no bot research imports)
        run: python -m unittest discover -s .github/release-guards -p 'test_*.py' -v
      - name: Reject whitespace damage
        run: git diff --check "$BASE_SHA"...HEAD