name: Infinix Media Integrity

on:
  pull_request:
    paths:
      - 'device-media/**'
      - 'tools/infinix-image-bot/**'
      - '.github/workflows/infinix_device_images.yml'
      - '.github/workflows/infinix_media_integrity_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install bot dependencies
        run: python -m pip install -r tools/infinix-image-bot/requirements.txt
      - name: Parse distribution metadata strictly
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (
              Path("device-media/distribution.json"),
              Path("device-media/device_media_manifest.json"),
          ):
              json.loads(path.read_text())
              print(f"PASS JSON: {path}")
          PY
      - name: Build immutable base metadata
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "$GITHUB_BASE_REF" --depth=1
          git show "origin/$GITHUB_BASE_REF:device-media/device_media_manifest.json" > "$RUNNER_TEMP/device_media_manifest.baseline.json"
          git show "origin/$GITHUB_BASE_REF:device-media/distribution.json" > "$RUNNER_TEMP/distribution.baseline.json"
      - name: Protect previously published distribution descriptors
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          old = json.loads((temp / "distribution.baseline.json").read_text())
          new = json.loads(Path("device-media/distribution.json").read_text())

          if old.get("schemaVersion") != new.get("schemaVersion"):
              raise SystemExit("ERROR: distribution schemaVersion changed")
          if old.get("mediaManifest", {}).get("url") != new.get("mediaManifest", {}).get("url"):
              raise SystemExit("ERROR: stable mediaManifest URL changed")

          old_chunks = {x["chunkId"]: x for x in old["chunks"]}
          new_chunks = {x["chunkId"]: x for x in new["chunks"]}
          missing = sorted(set(old_chunks) - set(new_chunks))
          if missing:
              raise SystemExit(f"ERROR: previously published chunks removed: {missing}")
          changed = sorted(k for k, v in old_chunks.items() if new_chunks[k] != v)
          if changed:
              raise SystemExit(f"ERROR: immutable chunk descriptors changed: {changed}")
          print(f"PASS: {len(old_chunks)} previous chunk descriptors are immutable")
          PY
      - name: Verify current media against PR base
        if: github.event_name == 'pull_request'
        run: |
          python tools/infinix-image-bot/verify_media.py --baseline-manifest "$RUNNER_TEMP/device_media_manifest.baseline.json"
      - name: Verify current media standalone
        if: github.event_name != 'pull_request'
        run: python tools/infinix-image-bot/verify_media.py
      - name: Run offline regression suite
        run: |
          mkdir -p tools/infinix-image-bot/output
          python -m unittest discover -s tools/infinix-image-bot -p 'test_*.py' -v
      - name: Reject whitespace damage
        run: git diff --check