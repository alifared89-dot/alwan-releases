name: Legacy research-bot regressions (non-publishing)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-bot-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public legacy bot for regression tests only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned legacy test dependency
        run: python -m pip install -r tools/infinix-image-bot/requirements.txt
      - name: Run full historical research-bot suite, with no discovery or publishing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/infinix-image-bot/output
          python -m unittest discover -s tools/infinix-image-bot -p 'test_*.py' -v
      - name: Check no tracked client data was altered
        run: git diff --exit-code
