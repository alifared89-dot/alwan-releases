name: Shadow-check independent public release validators

on:
  pull_request:
    paths:
      - '.github/release-guards/**'
      - '.github/release_scope_guard.py'
      - '.github/workflows/release_validators_shadow.yml'
  push:
    branches: [main]
    paths:
      - '.github/release-guards/**'
      - '.github/release_scope_guard.py'
      - '.github/workflows/release_validators_shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-validators-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact public PR branch without write credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify retained media guard byte parity and isolated compatibility sources
        shell: bash
        run: |
          set -euo pipefail
          # Historical compatibility authoring/tests now live in PRIVATE only.
          # Independent public compatibility validators are executed below on
          # real client manifest/payloads plus adversarial unit fixtures.
          for file in validate_release.py preserve_records.py test_validate_release.py test_preserve_records.py; do
            test -f ".github/release-guards/$file"
            test ! -e "tools/compatibility/$file"
          done
          test ! -e tools/compatibility/rebuild_release.py
          for file in media_integrity_guard.py verify_media.py test_media_integrity_guard.py test_verify_media_client_contract.py test_media_catalog_policy.py requirements.txt; do
            cmp -s ".github/release-guards/$file" "tools/infinix-image-bot/$file"
          done
          echo 'ALWAN-RELEASE-INDEPENDENT-GUARDS: 4 compatibility assets, 6/6 media exact parity'
      - name: Verify new files do not permit research or reports in the public repository
        run: python .github/release_scope_guard.py --self-test
      - name: Install identical published image validator dependency
        run: python -m pip install -r .github/release-guards/requirements.txt
      - name: Run brand-neutral release-validation regressions in isolated location
        run: python -m unittest discover -s .github/release-guards -p 'test_*.py' -v
      - name: Validate actual published compatibility content and preserve ALL records
        shell: bash
        run: |
          set -euo pipefail
          python .github/release-guards/validate_release.py \
            --root compatibility --baseline-manifest compatibility/manifest.json \
            --report "$RUNNER_TEMP/isolated-compatibility-report.json"
          python .github/release-guards/preserve_records.py \
            --previous compatibility --current compatibility
      - name: Validate current published image manifest and archives without touching data
        shell: bash
        run: |
          set -euo pipefail
          python .github/release-guards/media_integrity_guard.py \
            --baseline-manifest device-media/device_media_manifest.json \
            --baseline-distribution device-media/distribution.json \
            --current-manifest device-media/device_media_manifest.json \
            --current-distribution device-media/distribution.json \
            --base-commit "$(git rev-parse HEAD)"
          python .github/release-guards/verify_media.py \
            --baseline-manifest device-media/device_media_manifest.json \
            --catalog compatibility/payloads/catalog.json
      - name: Assert public tracked data and source files were not modified
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'ALWAN-RELEASE-SHADOW-READONLY-PASS'
      - name: Save audit artifact for PR reviewers (no client payload changes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validators-shadow-${{ github.run_id }}
          path: ${{ runner.temp }}/isolated-compatibility-report.json
          if-no-files-found: ignore
          retention-days: 14
