name: Infinix Device Images

on:
  push:
    branches:
      - diagnostic/infinix-three-reference-pages-20261009
  workflow_dispatch:
    inputs:
      mode:
        description: 'discover: review candidates, publish: only approved images'
        required: true
        type: choice
        default: discover
        options:
          - discover
          - publish
      start_id:
        description: 'Official storefront numeric start ID'
        default: '550'
        required: true
        type: string
      end_id:
        description: 'Official storefront numeric end ID (max 250 pages)'
        default: '750'
        required: true
        type: string
      limit:
        description: 'Maximum candidates (1-20)'
        default: '20'
        required: true
        type: string
      confirm_publish:
        description: 'For publish ONLY, enter PUBLISH_VERIFIED'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: infinix-media-publishing
  cancel-in-progress: false

jobs:
  images:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/infinix-image-bot/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r tools/infinix-image-bot/requirements.txt
      - name: Discover verified catalog candidates
        if: inputs.mode == 'discover'
        env:
          START_ID: ${{ inputs.start_id }}
          END_ID: ${{ inputs.end_id }}
          LIMIT: ${{ inputs.limit }}
        run: |
          python tools/infinix-image-bot/bot.py discover --start "$START_ID" --stop "$END_ID" --limit "$LIMIT"
      - name: Upload review report for phone
        if: inputs.mode == 'discover'
        uses: actions/upload-artifact@v4
        with:
          name: infinix-review-${{ github.run_id }}
          path: tools/infinix-image-bot/output/
          retention-days: 30
      - name: Reject unconfirmed publication
        if: inputs.mode == 'publish' && inputs.confirm_publish != 'PUBLISH_VERIFIED'
        run: |
          echo 'Publication not explicitly confirmed.'
          exit 1
      - name: Publish only human-approved media
        if: inputs.mode == 'publish' && inputs.confirm_publish == 'PUBLISH_VERIFIED'
        run: |
          python tools/infinix-image-bot/bot.py publish
          git diff --check
          python tools/infinix-image-bot/verify_media.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add device-media/
          git commit -m "Publish approved Infinix device photos"
          git push origin HEAD:main

  reference-diagnostics:
    if: github.event_name == 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only current bot dependency
        run: python -m pip install -r tools/infinix-image-bot/requirements.txt
      - name: Diagnose exactly three known official device pages
        run: |
          python - <<'PY'
          import sys, json, re, html, urllib.request, io
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "tools/infinix-image-bot"))
          import bot
          published = {entry["deviceId"] for entry in json.loads((bot.MEDIA / "device_media_manifest.json").read_text())["entries"]}
          for pid in (1351, 1453, 1555):
              url = f"https://wap.my.infinixmobility.com/shop/{pid}"
              row = {"pageId": pid, "sourceUrl": url}
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": bot.USER_AGENT})
                  with urllib.request.urlopen(request, timeout=18) as response:
                      data = response.read(1300001)
                      row.update(httpStatus=response.status, finalUrl=response.url, contentType=response.headers.get("Content-Type"), htmlBytes=len(data))
                  text = data.decode("utf-8", "replace")
                  title_match = re.search(r"<title[^>]*>(.*?)</title>", text, re.IGNORECASE | re.DOTALL)
                  title = html.unescape(title_match.group(1).strip()) if title_match else ""
                  skus = re.findall(r'(?i)(?:\\\\\\\"|")sku(?:\\\\\\\"|")\\s*:\\s*(?:\\\\\\\"|")([A-Z][A-Z0-9-]{3,15})', text)
                  if not skus:
                      skus = re.findall(r"(?i)extra_info:.{0,90}?sku.{0,12}?(X[0-9]{3,6}[A-Z]?)", text)
                  row.update(title=title, skuCodes=skus[:15], skuKeywordOccurrences=len(re.findall(r"sku", text, re.I)), hasGalleryMarker=("images:[{alt:" in text), possibleCatalogImageUrls=len(re.findall(r"/media/catalog/product/", text)), codeMatches=[{"code": code, "catalogCount": len(bot.BY_CODE.get(code.upper(), [])), "nameMatch": any(bot.normalized(d["name"]) in bot.normalized(title) for d in bot.BY_CODE.get(code.upper(), []))} for code in skus[:10]])
                  result = bot.official_page(pid)
                  row["strictParserResult"] = result
                  if result and result.get("imageUrls"):
                      image_url = result["imageUrls"][0]
                      try:
                          req = urllib.request.Request(image_url, headers={"User-Agent": bot.USER_AGENT})
                          with urllib.request.urlopen(req, timeout=18) as response:
                              image_data = response.read(6000001)
                              img_meta = {"url": response.url, "httpStatus": response.status, "contentType": response.headers.get("Content-Type"), "bytes": len(image_data)}
                          im = bot.Image.open(io.BytesIO(image_data))
                          im.load()
                          img_meta.update(width=im.width, height=im.height, mode=im.mode, sha256=bot.sha(image_data))
                          row["firstImage"] = img_meta
                      except Exception as image_error:
                          row["firstImageError"] = f"{type(image_error).__name__}: {str(image_error)[:200]}"
                  if result:
                      row["alreadyPublished"] = result["deviceId"] in published
                  else:
                      row["alreadyPublished"] = "undetermined_by_current_parser"
              except Exception as error:
                  row["error"] = f"{type(error).__name__}: {str(error)[:250]}"
              print("ALWAN_DIAGNOSTIC " + json.dumps(row, ensure_ascii=False))
          PY
