name: Infinix Device Images

on:
  pull_request:
    paths:
      - 'tools/infinix-image-bot/**'
      - 'device-media/**'
      - '.github/workflows/infinix_device_images.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'discover: review candidates, publish: only approved images'
        required: true
        type: choice
        default: discover
        options:
          - discover
          - publish
      start_id:
        description: 'Official storefront numeric start ID'
        default: '550'
        required: true
        type: string
      end_id:
        description: 'Official storefront numeric end ID (max 250 pages)'
        default: '750'
        required: true
        type: string
      limit:
        description: 'Maximum candidates (1-20)'
        default: '20'
        required: true
        type: string
      confirm_publish:
        description: 'For publish ONLY, enter PUBLISH_VERIFIED'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: infinix-media-publishing
  cancel-in-progress: false

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/infinix-image-bot/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r tools/infinix-image-bot/requirements.txt
      - name: Run Infinix bot regressions
        run: |
          mkdir -p tools/infinix-image-bot/output
          python -m unittest discover -s tools/infinix-image-bot -p 'test_*.py' -q
      - name: Verify immutable media and presentation of newly added images
        run: |
          git fetch --no-tags --depth=1 origin main
          git show FETCH_HEAD:device-media/device_media_manifest.json > "$RUNNER_TEMP/media-before.json"
          python tools/infinix-image-bot/verify_media.py --baseline-manifest "$RUNNER_TEMP/media-before.json"
      - name: Compare all 28 real published images without changing media
        if: github.event_name == 'pull_request'
        run: |
          python tools/infinix-image-bot/audit_media.py --report-dir "$RUNNER_TEMP/infinix-image-qa"
      - name: Upload original vs normalized real-image contact sheet
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: infinix-real-image-qa-${{ github.run_id }}
          path: ${{ runner.temp }}/infinix-image-qa/
          retention-days: 14
  images:
    if: github.event_name == 'workflow_dispatch'
    needs: quality-checks
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/infinix-image-bot/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r tools/infinix-image-bot/requirements.txt
      - name: Discover verified catalog candidates
        if: inputs.mode == 'discover'
        env:
          START_ID: ${{ inputs.start_id }}
          END_ID: ${{ inputs.end_id }}
          LIMIT: ${{ inputs.limit }}
        run: |
          python tools/infinix-image-bot/bot.py discover --start "$START_ID" --stop "$END_ID" --limit "$LIMIT"
      - name: Upload review report for phone
        if: inputs.mode == 'discover'
        uses: actions/upload-artifact@v4
        with:
          name: infinix-review-${{ github.run_id }}
          path: tools/infinix-image-bot/output/
          retention-days: 30
      - name: Reject unconfirmed publication
        if: inputs.mode == 'publish' && inputs.confirm_publish != 'PUBLISH_VERIFIED'
        run: |
          echo 'Publication not explicitly confirmed.'
          exit 1
      - name: Publish only human-approved media
        if: inputs.mode == 'publish' && inputs.confirm_publish == 'PUBLISH_VERIFIED'
        run: |
          git show HEAD:device-media/device_media_manifest.json > "$RUNNER_TEMP/media-before.json"
          python tools/infinix-image-bot/bot.py publish
          git diff --check
          python tools/infinix-image-bot/verify_media.py --baseline-manifest "$RUNNER_TEMP/media-before.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add device-media/
          git commit -m "Publish approved Infinix device photos"
          git push origin HEAD:main
