name: HOT12 One-Image Media Trial

on:
  push:
    branches:
      - test/hot12-remote-media-20261010

permissions:
  contents: write

jobs:
  prepare-hot12-only:
    if: "!contains(github.event.head_commit.message, '[generated-hot12]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned image engine
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Stage HOT12 image from immutable published PNG
        run: python tools/infinix-image-bot/stage_hot12_media_trial.py
      - name: Verify all previous chunks, SHA and exactly one new image
        run: |
          python tools/infinix-image-bot/verify_media.py
          python - <<'PY'
          import json, hashlib, pathlib
          root=pathlib.Path('device-media')
          m=json.loads((root/'device_media_manifest.json').read_text())
          d=json.loads((root/'distribution.json').read_text())
          assert len(m['entries']) == 62
          assert sum(x['verifiedModelCodes'] == ['X6817'] for x in m['entries']) == 2
          assert m['entries'][0]['revision'] == 'infinix-approved-x6817-frontback-v2-trial'
          assert len(d['chunks']) == 48
          manifest_bytes=(root/'device_media_manifest.json').read_bytes()
          assert hashlib.sha256(manifest_bytes).hexdigest() == d['mediaManifest']['sha256']
          print('PASS: exactly one new HOT12 image, 61 previous entries preserved')
          PY
          git diff --check
          git diff --name-only | grep -Fx 'device-media/device_media_manifest.json'
          git diff --name-only | grep -Fx 'device-media/distribution.json'
          test "$(git ls-files --others --exclude-standard device-media/chunks | wc -l)" -eq 1
      - name: Commit trial to isolated branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add device-media/device_media_manifest.json device-media/distribution.json device-media/chunks/
          git commit -m 'Generate HOT12 single-image trial [generated-hot12]'
          git push origin HEAD:test/hot12-remote-media-20261010
