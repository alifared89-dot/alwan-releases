name: Compatibility Data Contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read previous release data for every execution mode
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            base="$PUSH_BEFORE_SHA"
          else
            git fetch origin main
            base="$(git rev-parse origin/main)"
          fi
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" =~ ^0{40}$ ]]; then
            echo "ALWAN-DATA-BASELINE-MISSING: refusing to publish without production baseline"
            exit 1
          fi
          git cat-file -e "$base^{commit}"
          folder="$RUNNER_TEMP/compatibility-previous"
          mkdir -p "$folder/payloads"
          git show "$base:compatibility/manifest.json" > "$folder/manifest.json"
          for name in catalog display battery charging camera flex audio; do
            git show "$base:compatibility/payloads/$name.json" > "$folder/payloads/$name.json"
          done
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "PREVIOUS_RELEASE_ROOT=$folder" >> "$GITHUB_ENV"
      - name: Prevent accidentally publishing new private bot sources or research reports
        shell: bash
        run: |
          set -euo pipefail
          python .github/release_scope_guard.py --self-test
          python .github/release_scope_guard.py --base "$BASE_SHA"
      - name: Run production-compatible data contract
        id: validate
        shell: bash
        run: |
          set +e
          BASELINE_ARGS=()
          BASELINE_ARGS=(--baseline-manifest "$PREVIOUS_RELEASE_ROOT/manifest.json")
          python .github/release-guards/validate_release.py \
            --root compatibility \
            --report compatibility-validation-report.json \
            "${BASELINE_ARGS[@]}"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload machine-readable rejection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-validation-${{ github.run_id }}
          path: compatibility-validation-report.json
          retention-days: 30
      - name: Preserve every published device and compatibility record
        shell: bash
        run: |
          set -euo pipefail
          deleted="$(git diff --name-only --diff-filter=D "$BASE_SHA"...HEAD -- compatibility/)"
          if [ -n "$deleted" ]; then
            echo "ALWAN-DATA-DELETE-DENIED: published files may not be removed"
            echo "$deleted"
            exit 1
          fi
          python .github/release-guards/preserve_records.py \
            --previous "$PREVIOUS_RELEASE_ROOT" --current compatibility
      - name: Run compatibility-only validation and record-preservation regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s .github/release-guards -p 'test_validate_release.py' -v
          python -m unittest discover -s .github/release-guards -p 'test_preserve_records.py' -v
      - name: Reject committed whitespace damage
        run: git diff --check "$BASE_SHA"...HEAD
      - name: Enforce contract result
        shell: bash
        run: |
          if [ "${{ steps.validate.outputs.status }}" != "0" ]; then
            echo "Compatibility data rejected. Read the ALWAN-DATA-* error above or the uploaded JSON report."
            exit 1
          fi
