name: Compatibility Data Contract

on:
  pull_request:
    paths:
      - 'compatibility/**'
      - 'tools/compatibility/**'
      - '.github/workflows/compatibility_integrity_ci.yml'
  push:
    branches: [main]
    paths:
      - 'compatibility/**'
      - 'tools/compatibility/**'
      - '.github/workflows/compatibility_integrity_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read prior published manifest (without altering production data)
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            baseline="$PR_BASE_SHA"
          else
            baseline="$PUSH_BEFORE_SHA"
          fi
          if [[ "$baseline" =~ ^[0-9a-f]{40}$ ]] && [[ "$baseline" != "0000000000000000000000000000000000000000" ]]; then
            git show "$baseline:compatibility/manifest.json" > "$RUNNER_TEMP/compatibility-baseline.json"
          else
            echo "No prior manifest baseline available; validating current payloads."
          fi
      - name: Run production-compatible data contract
        id: validate
        shell: bash
        run: |
          set +e
          BASELINE_ARGS=()
          if [ -f "$RUNNER_TEMP/compatibility-baseline.json" ]; then
            BASELINE_ARGS=(--baseline-manifest "$RUNNER_TEMP/compatibility-baseline.json")
          fi
          python tools/compatibility/validate_release.py \
            --root compatibility \
            --report compatibility-validation-report.json \
            "${BASELINE_ARGS[@]}"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload machine-readable rejection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-validation-${{ github.run_id }}
          path: compatibility-validation-report.json
          retention-days: 30
      - name: Run validator regression tests
        run: python -m unittest discover -s tools/compatibility -p 'test_*.py' -v
      - name: Enforce contract result
        shell: bash
        run: |
          if [ "${{ steps.validate.outputs.status }}" != "0" ]; then
            echo "Compatibility data rejected. Read the ALWAN-DATA-* error above or the uploaded JSON report."
            exit 1
          fi
